<section id="about" class="py-20 md:py-32">
  <app-section-title title="About Me" backgroundText="About"></app-section-title>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
    <!-- Left Column: Avatar & Quick Info -->
    <div class="md:col-span-1 space-y-6">
      <img src="https://placehold.co/300x300/1F2937/ffffff?text=Meet+Patel" alt="Meet Patel Avatar"
        class="w-full h-auto rounded-xl object-cover border-4 border-[--accent-color] shadow-2xl transition duration-500 hover:scale-[1.02] transform hover:shadow-[0_0_30px_rgba(255,140,0,0.5)] interactive"
        appCursorHover="image" [hoverScale]="1.6">
      <div class="text-sm font-mono text-gray-400 text-muted border-t border-gray-800 light:border-gray-300 pt-6">
        <p>Location: Ahmadabad, Gujarat</p>
        <p>Role: Software Engineer</p>
        <p>Tech Focus: Angular, Node, AWS</p>
      </div>
    </div>

    <!-- Right Column: Narrative Text -->
    <div class="md:col-span-2 space-y-6 text-lg text-gray-400 text-muted leading-relaxed">
      @for (points of aboutMe(); track $index) {
      <p>
        {{points}}
      </p>
