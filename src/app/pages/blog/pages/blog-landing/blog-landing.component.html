<div class="blog-page min-h-screen pt-32 pb-20 px-6">
    <div class="max-w-5xl mx-auto">
        <!-- Blog Hero -->
        <app-blog-hero />

        <!-- Featured Post -->
        <app-blog-featured-post [post]="featuredPost" />

        <!-- Latest Articles Section -->
        <section class="animate-slide-in-up" style="animation-delay: 0.2s;">
            <div
                class="flex items-center justify-between mb-8 border-b border-[var(--border-light)] dark:border-[var(--border-dark)] pb-4">
                <h2 class="text-2xl font-semibold tracking-tight transition-colors duration-300">Latest Articles</h2>
            </div>

            <!-- Articles Grid -->
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                @for (article of articles; track article.id) {
                <app-blog-article-card [article]="article" />
                }
            </div>
        </section>
    </div>
</div>
