<section class="mb-20 animate-slide-in-up" style="animation-delay: 0.1s;">
    <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-semibold tracking-tight transition-colors duration-300">Featured</h2>
    </div>

    <a [routerLink]="'/blog/' + post.slug"
        class="group block relative rounded-2xl border border-[var(--border-light)] dark:border-[var(--border-dark)] bg-[var(--card-light)] dark:bg-[var(--card-dark)] overflow-hidden hover:border-[var(--accent-color)] hover:shadow-[0_0_15px_rgba(255,140,0,0.1)] transition-all duration-300">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-0">
            <!-- Content Side -->
            <div class="p-8 md:p-12 flex flex-col justify-center">
                <!-- Meta Info -->
                <div
                    class="flex items-center gap-3 text-xs font-medium text-[var(--muted-light)] dark:text-[var(--muted-dark)] mb-4">
                    <span class="px-2 py-0.5 rounded-md bg-gray-500/10">{{ post.category }}</span>
                    <span>{{ post.date }}</span>
                    <span>•</span>
                    <span>{{ post.readTime }}</span>
                </div>

                <!-- Title -->
                <h3 class="text-3xl font-bold mb-4 group-hover:text-[var(--accent-color)] transition-colors">
                    {{ post.title }}
                </h3>

                <!-- Excerpt -->
                <p class="text-[var(--muted-light)] dark:text-[var(--muted-dark)] mb-6 leading-relaxed">
                    {{ post.excerpt }}
                </p>

                <!-- CTA -->
                <span
                    class="inline-flex items-center text-sm font-medium text-[var(--accent-color)] group-hover:translate-x-1 transition-transform">
                    Read Article <span class="ml-2">→</span>
                </span>
            </div>

            <!-- Visual Pattern Side -->
            <div
                class="featured-visual bg-black/5 dark:bg-[#111111] border-t md:border-t-0 md:border-l border-[var(--border-light)] dark:border-[var(--border-dark)] relative overflow-hidden flex items-center justify-center min-h-[250px] transition-colors duration-300">
                <div class="absolute inset-0 bg-gradient-to-tr from-[var(--accent-color)]/20 to-transparent opacity-50">
                </div>
                <div
                    class="w-32 h-32 rounded-full bg-gradient-to-tr from-[var(--card-light)] dark:from-[var(--card-dark)] to-[var(--bg-light)] dark:to-[var(--bg-dark)] border border-[var(--border-light)] dark:border-[var(--border-dark)] flex items-center justify-center shadow-2xl group-hover:scale-110 group-hover:border-[var(--accent-color)]/50 transition-all duration-500">
                    <span class="font-mono text-2xl text-[var(--muted-light)] dark:text-[var(--muted-dark)]">
                        {{ post.visualIcon || '{ }' }}
                    </span>
                </div>
            </div>
        </div>
    </a>
</section>
