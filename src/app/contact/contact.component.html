<section id="contact" class="py-20 md:py-32 relative overflow-hidden">
  <!-- Animated background elements -->
  <div class="absolute inset-0 -z-10 pointer-events-none">
    <div
      class="absolute top-10 left-10 w-64 h-64 bg-gradient-to-r from-[--accent-color]/5 to-[--accent-hover]/5 rounded-full blur-3xl floating">
    </div>
    <div
      class="absolute bottom-10 right-10 w-80 h-80 bg-gradient-to-r from-[--accent-color]/5 to-[--accent-hover]/5 rounded-full blur-3xl floating"
      style="animation-delay: -2s;"></div>
  </div>

  <h2
    class="text-4xl sm:text-5xl font-extrabold mb-12 relative text-center mx-auto w-fit text-[--text-light] dark:text-[--text-dark]"
    data-aos="fade-up">
    <span
      class="text-muted opacity-20 absolute -left-24 text-9xl top-1/4 transform -translate-y-1/2 -z-10 hidden md:block">Connect</span>
    <span class="accent-text">//</span> Get In Touch
  </h2>

  <div class="container mx-auto px-4">
    <div
      class="bg-[--card-light-hover]/80 dark:bg-[--card-dark-hover]/40 border border-[--border-light] dark:border-[--border-dark] rounded-3xl p-8 md:p-12 backdrop-blur-sm shadow-xl dark:shadow-none"
      data-aos="fade-up">
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 lg:gap-16 items-start">

        <!-- Left Column: Contact Info -->
        <div>
          <h2 class="text-4xl sm:text-5xl font-extrabold mb-6 text-[--text-light] dark:text-[--text-dark]">
            Let's build something <span class="accent-text">extraordinary.</span>
          </h2>
          <p class="text-xl text-muted mb-12 leading-relaxed">
            Whether you have a question, a project idea, or just want to say hi, I'm always open to discussing new
            opportunities.
          </p>

          <div class="space-y-6 mb-12">
            <!-- Email -->
            <div class="flex items-center space-x-4">
              <div
                class="w-12 h-12 rounded-lg bg-[--bg-light-secondary] dark:bg-[--card-dark] flex items-center justify-center border border-[--border-light] dark:border-[--border-dark]">
                <svg class="w-6 h-6 text-[--accent-color]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z">
                  </path>
                </svg>
              </div>
              <div>
                <p class="text-sm text-muted font-medium tracking-wider uppercase">Email</p>
                <a href="mailto:meet.codes247@gmail.com"
                  class="text-[--text-light] dark:text-[--text-dark] hover:text-[--accent-hover] transition-colors text-lg">meet.codes247&#64;gmail.com</a>
              </div>
            </div>

            <!-- Location -->
            <div class="flex items-center space-x-4">
              <div
                class="w-12 h-12 rounded-lg bg-[--bg-light-secondary] dark:bg-[--card-dark] flex items-center justify-center border border-[--border-light] dark:border-[--border-dark]">
                <svg class="w-6 h-6 text-[--accent-color]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path>
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
              </div>
              <div>
                <p class="text-sm text-muted font-medium tracking-wider uppercase">Location</p>
                <p class="text-[--text-light] dark:text-[--text-dark] text-lg">Ahmedabad, India</p>
              </div>
            </div>
          </div>

          <!-- Socials -->
          <div>
            <p class="text-sm text-muted font-medium tracking-wider uppercase mb-4">Socials</p>
            <div class="flex space-x-4">
              <a href="https://github.com/mkpatel-247" target="_blank"
                class="w-10 h-10 rounded-lg bg-[--bg-light-secondary] dark:bg-[--card-dark] flex items-center justify-center border border-[--border-light] dark:border-[--border-dark] text-muted hover:text-[--accent-color] hover:bg-[--bg-light] dark:hover:text-white dark:hover:bg-[--card-dark-hover] transition-all">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path
                    d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.087-.731.084-.67.084-.67 1.205.084 1.838 1.237 1.838 1.237 1.07 1.835 2.809 1.305 3.492.998.108-.776.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.046.138 3.003.404 2.293-1.552 3.301-1.23 3.301-1.23.653 1.653.242 2.873.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576C20.566 21.79 24 17.292 24 12 24 5.373 18.627 0 12 0z" />
                </svg>
              </a>
              <a href="https://linkedin.com/in/meetpatel-24" target="_blank"
                class="w-10 h-10 rounded-lg bg-[--bg-light-secondary] dark:bg-[--card-dark] flex items-center justify-center border border-[--border-light] dark:border-[--border-dark] text-muted hover:text-[--accent-color] hover:bg-[--bg-light] dark:hover:text-white dark:hover:bg-[--card-dark-hover] transition-all">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                  <path
                    d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.529-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                </svg>
              </a>
            </div>
          </div>
        </div>

        <!-- Right Column: Form -->
        <div>
          <div class="relative">
            <!-- Maintenance Overlay -->
            <div
              class="absolute inset-0 z-10 bg-white/50 dark:bg-black/50 backdrop-blur-[2px] rounded-lg flex items-center justify-center">
              <div
                class="bg-yellow-500/10 border border-yellow-500/20 rounded-xl p-6 backdrop-blur-md transform rotate-[-5deg] hover:rotate-0 transition-transform duration-300 shadow-2xl">
                <div class="flex items-center space-x-3 text-yellow-600 dark:text-yellow-500">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                    </path>
                  </svg>
                  <span class="text-xl font-bold uppercase tracking-wider">Under Maintenance</span>
                </div>
              </div>
            </div>

            <form [formGroup]="contactForm" (ngSubmit)="onSubmit()"
              class="space-y-6 opacity-40 pointer-events-none select-none">
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Name -->
                <div class="space-y-2">
                  <label for="name" class="text-xs font-bold text-muted uppercase tracking-wider">Name</label>
                  <input id="name" type="text" formControlName="name" placeholder="John Doe"
                    class="w-full bg-[--bg-light-secondary] dark:bg-[--card-dark] border border-[--border-light] dark:border-[--border-dark] rounded-lg px-4 py-3 text-[--text-light] dark:text-[--text-dark] focus:outline-none focus:border-[--accent-color] focus:ring-1 focus:ring-[--accent-color] transition-colors"
                    [class.border-red-500]="contactForm.get('name')?.invalid && contactForm.get('name')?.touched">
                </div>

                <!-- Email -->
                <div class="space-y-2">
                  <label for="email" class="text-xs font-bold text-muted uppercase tracking-wider">Email</label>
                  <input id="email" type="email" formControlName="email" placeholder="john@example.com"
                    class="w-full bg-[--bg-light-secondary] dark:bg-[--card-dark] border border-[--border-light] dark:border-[--border-dark] rounded-lg px-4 py-3 text-[--text-light] dark:text-[--text-dark] focus:outline-none focus:border-[--accent-color] focus:ring-1 focus:ring-[--accent-color] transition-colors"
                    [class.border-red-500]="contactForm.get('email')?.invalid && contactForm.get('email')?.touched">
                </div>
              </div>

              <!-- Subject -->
              <div class="space-y-2">
                <label for="subject" class="text-xs font-bold text-muted uppercase tracking-wider">Subject</label>
                <div class="relative">
                  <select id="subject" formControlName="subject"
                    class="w-full bg-[--bg-light-secondary] dark:bg-[--card-dark] border border-[--border-light] dark:border-[--border-dark] rounded-lg px-4 py-3 text-[--text-light] dark:text-[--text-dark] focus:outline-none focus:border-[--accent-color] focus:ring-1 focus:ring-[--accent-color] transition-colors appearance-none cursor-pointer">
                    <option value="General Inquiry">General Inquiry</option>
                    <option value="Project Proposal">Project Proposal</option>
                    <option value="Freelance Opportunity">Freelance Opportunity</option>
                    <option value="Other">Other</option>
                  </select>
                  <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-muted">
                    <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                    </svg>
                  </div>
                </div>
              </div>

              <!-- Message -->
              <div class="space-y-2">
                <label for="message" class="text-xs font-bold text-muted uppercase tracking-wider">Message</label>
                <textarea id="message" formControlName="message" rows="4" placeholder="Tell me about your project..."
                  class="w-full bg-[--bg-light-secondary] dark:bg-[--card-dark] border border-[--border-light] dark:border-[--border-dark] rounded-lg px-4 py-3 text-[--text-light] dark:text-[--text-dark] focus:outline-none focus:border-[--accent-color] focus:ring-1 focus:ring-[--accent-color] transition-colors resize-none"
                  [class.border-red-500]="contactForm.get('message')?.invalid && contactForm.get('message')?.touched"></textarea>
              </div>

              <!-- Submit Button (Disabled) -->
              <button type="button" disabled
                class="w-full bg-[--border-light] dark:bg-[--border-dark] text-muted font-bold py-4 px-8 rounded-lg cursor-not-allowed flex items-center justify-center space-x-2">
                <span>Under Maintenance</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                  </path>
                </svg>
              </button>
              <!-- Submit Button -->
              <button type="submit"
                class="w-full bg-orange-500 hover:bg-orange-600 text-white font-bold py-4 px-8 rounded-lg transition-all duration-300 transform hover:-translate-y-1 flex items-center justify-center space-x-2"
                [disabled]="contactForm.invalid" [class.opacity-50]="contactForm.invalid"
                [class.cursor-not-allowed]="contactForm.invalid">
                <span>Send Message</span>
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3">
                  </path>
                </svg>
              </button>
            </form>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
